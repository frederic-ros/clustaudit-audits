# Publishes the site (docs/) on GitHub Pages. Settings > Pages > Source: "GitHub Actions".
name: Pages

on:
  push:
    branches: [main]
    paths: ["docs/**"]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          # called from the Audit workflow, the event's commit predates the new card
          ref: ${{ github.event.repository.default_branch }}
      - name: Rebuild the gallery index from the audits present
        run: python3 -m auditkit reindex --site docs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
